# Reconciliations cell: one of the ten finance services split from the retired finance_* tables (2026-10-12).
# Checks of an account (account_id) against a statement or export for a period.
# Amounts are exact (money = numeric(19,4), decimal = numeric(30,10); SPEC-003); cross-cell ids (account_id, ...) are plain bigints, not foreign keys.
cell: reconciliations
title: Reconciliations
resources:
  reconciliation:
    # SPEC-005: reference data only in events (no amounts, names or notes).
    graph: [account_id, period_start, period_end, source_type, currency, status]
    filters:
    - account_id
    - status
    - source_type
    ranges:
    - [period_start, period_end]
    fields:
      account_id:
        type: bigint
      period_start:
        type: date
        required: true
      period_end:
        type: date
        required: true
      source_type:
        type: enum
        values:
        - bank_statement
        - wallet_export
        - invoice_register
        - manual
        - other
        required: true
      source_ref:
        type: text
      expected_amount:
        type: money
      reconciled_amount:
        type: money
      difference_amount:
        type: money
      currency:
        type: currency
        default: THB
      status:
        type: enum
        values:
        - open
        - matched
        - exception
        - closed
        default: open
      reconciled_at:
        type: timestamp
      notes:
        type: text
